<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h2 class="sidebar-title">Templates</h2>
                <div class="templates-grid" id="templatesGrid">
                    <!-- Templates will be dynamically loaded here -->
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <h2 class="sidebar-title">Upload</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <label for="imageInput" class="upload-label">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Upload Image</p>
                        <p class="upload-hint">PNG, JPG, GIF, WEBP</p>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="canvas-section" id="canvasSection" style="display: none;">
                <div class="canvas-container">
                    <div class="canvas-wrapper" id="canvasWrapper">
                        <canvas id="memeCanvas"></canvas>
                        <div class="text-boxes-overlay" id="textBoxesOverlay"></div>
                    </div>
                </div>
            </div>
            <div class="empty-state" id="emptyState">
                <h1>Meme Generator</h1>
                <p>Select a template or upload an image to get started</p>
            </div>
        </main>

        <!-- Bottom Toolbar -->
        <div class="bottom-toolbar" id="controlsSection" style="display: none;">
            <div class="toolbar-content">
                <div class="toolbar-section">
                    <button id="addTextBtn" class="btn btn-primary">+ Add Text</button>
                </div>
                
                <div class="toolbar-section text-controls-list" id="textControlsList">
                    <!-- Text controls will be dynamically added here -->
                </div>

                <div class="toolbar-section">
                    <button id="downloadBtn" class="btn btn-download">Download</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
